<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Log</title>

<meta name="theme-color" content="#e87a90">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Feeds">
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icons/icon-192.png">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">

<link rel="stylesheet" href="static/app.css">
<script src="static/sync.js" defer></script>
<script src="static/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>Feed Log</h1>
    <button id="syncStatus" class="sync" type="button"></button>
  </header>

  <nav class="tabs" id="viewTabs" role="tablist">
    <button type="button" role="tab" data-view="feed" id="feedTab">Feed</button>
    <button type="button" role="tab" data-view="diaper">Diaper</button>
    <button type="button" role="tab" data-view="history">History</button>
  </nav>

  <section class="card" id="entryView">
    <div id="feedFields">
      <label class="field" for="feedStart">Start of feed</label>
      <div class="row">
        <input type="datetime-local" id="feedStart">
        <button class="btn-secondary" type="button" data-now="feedStart">Now</button>
      </div>
      <div class="sides">
        <div class="side">
          <label class="field" for="left">Left</label>
          <div class="stepper">
            <button type="button" data-target="left" data-step="-1" aria-label="Left minus one">−</button>
            <input type="number" id="left" inputmode="numeric" min="0" max="180" value="0">
            <button type="button" data-target="left" data-step="1" aria-label="Left plus one">+</button>
          </div>
          <div class="unit">min</div>
          <div class="quick">
            <button type="button" data-target="left" data-step="-30">−30</button>
            <button type="button" data-target="left" data-step="-15">−15</button>
            <button type="button" data-target="left" data-step="15">+15</button>
            <button type="button" data-target="left" data-step="30">+30</button>
          </div>
          <button type="button" class="timer" data-side="left"></button>
        </div>
        <div class="side">
          <label class="field" for="right">Right</label>
          <div class="stepper">
            <button type="button" data-target="right" data-step="-1" aria-label="Right minus one">−</button>
            <input type="number" id="right" inputmode="numeric" min="0" max="180" value="0">
            <button type="button" data-target="right" data-step="1" aria-label="Right plus one">+</button>
          </div>
          <div class="unit">min</div>
          <div class="quick">
            <button type="button" data-target="right" data-step="-30">−30</button>
            <button type="button" data-target="right" data-step="-15">−15</button>
            <button type="button" data-target="right" data-step="15">+15</button>
            <button type="button" data-target="right" data-step="30">+30</button>
          </div>
          <button type="button" class="timer" data-side="right"></button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <label class="field" for="feedNote">Note</label>
      <textarea id="feedNote" class="note-input" rows="2" placeholder="Optional"></textarea>
    </div>

    <div id="diaperFields" hidden>
      <label class="field" for="diaperTime">Time</label>
      <div class="row">
        <input type="datetime-local" id="diaperTime">
        <button class="btn-secondary" type="button" data-now="diaperTime">Now</button>
      </div>
      <div class="toggles">
        <button type="button" class="toggle" id="peeBtn" aria-pressed="false">Pee</button>
        <button type="button" class="toggle" id="poopBtn" aria-pressed="false">Poop</button>
      </div>
      <label class="field" for="diaperNote">Note</label>
      <textarea id="diaperNote" class="note-input" rows="2" placeholder="Optional"></textarea>
    </div>

    <button class="btn-primary" id="saveBtn" type="button">Save feed</button>
    <button class="btn-link" id="cancelBtn" type="button" hidden>Cancel edit</button>
  </section>

  <div id="historyView" hidden>
    <section class="card filters">
      <input type="search" id="searchFilter" class="filter-input" placeholder="Search notes" autocomplete="off" enterkeyhint="search">
      <div class="tabs" id="typeFilter">
        <button type="button" data-type="all">All</button>
        <button type="button" data-type="feed">Feeds</button>
        <button type="button" data-type="diaper">Diapers</button>
      </div>
      <div class="filter-day">
        <label for="dayFilter">Day</label>
        <input type="date" id="dayFilter" class="filter-input">
      </div>
      <div class="filter-status" id="filterStatus" hidden>
        <span id="filterCount"></span>
        <button type="button" id="clearFilters">Clear filters</button>
      </div>
    </section>

    <div id="history"></div>

    <footer>
      <button class="btn-secondary" id="exportBtn" type="button">Export CSV</button>
    </footer>
  </div>
</main>

<dialog id="settings">
  <h2>Sync with Airtable</h2>
  <p class="hint">
    Both phones use the same base and token. The base needs a <b>Feeds</b> table
    (<b>Start</b>, <b>Left</b>, <b>Right</b>) and a <b>Diapers</b> table (<b>Time</b>, <b>Pee</b>, <b>Poop</b>).
  </p>
  <label class="field" for="baseInput">Airtable base (ID or any link to it)</label>
  <input type="text" id="baseInput" class="setting" placeholder="app…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="field" for="tokenInput">Personal access token (data.records:read + write)</label>
  <input type="password" id="tokenInput" class="setting" placeholder="pat…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="hint" id="settingsError" hidden></p>
  <div class="dialog-actions">
    <button class="btn-secondary" id="removeTokenBtn" type="button">Stop syncing</button>
    <button class="btn-secondary" id="closeSettingsBtn" type="button">Cancel</button>
    <button class="btn-primary" id="saveTokenBtn" type="button">Save</button>
  </div>
</dialog>
</body>
</html>
