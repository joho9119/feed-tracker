<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e87a90">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Feeds">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Feed Log</title>
<style>
  :root {
    --accent: #e87a90;
    --accent-dark: #c95d74;
    --bg: #faf6f7;
    --card: #fff;
    --text: #2b2326;
    --muted: #8a7f83;
    --border: #eadfe2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1618;
      --card: #262023;
      --text: #f3eced;
      --muted: #a39599;
      --border: #3a3135;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 16px; }
  h1 { font-size: 22px; margin: 0; }
  .sync {
    background: none;
    color: var(--muted);
    font-size: 13px;
    padding: 6px 0 6px 12px;
    text-align: right;
  }
  .sync::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--dot, var(--muted));
  }
  .sync[data-state=ok] { --dot: #3aa76d; }
  .sync[data-state=busy] { --dot: #e0a526; }
  .sync[data-state=error] { --dot: #d9534f; color: var(--text); }
  dialog {
    width: min(92vw, 420px);
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    padding: 20px;
  }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h2 { font-size: 18px; margin-bottom: 8px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  #settingsError { color: #d9534f; }
  .setting {
    width: 100%;
    font: inherit;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  .dialog-actions { display: flex; gap: 8px; }
  .dialog-actions .btn-primary { width: auto; flex: 1; padding: 10px; }
  li .pending { color: #e0a526; }
  li .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    margin-left: 4px;
    border-radius: 6px;
    vertical-align: 2px;
    background: color-mix(in srgb, #4a90d9 15%, transparent);
    color: #4a90d9;
  }
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: var(--bg);
  }
  .tabs button { padding: 8px; background: none; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected=true] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .toggle {
    padding: 20px 0;
    font-size: 18px;
    font-weight: 600;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
  }
  .toggle[aria-pressed=true] {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border-color: var(--accent);
    color: var(--accent-dark);
  }
  h2 { font-size: 15px; margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label.field { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  input[type=datetime-local] {
    flex: 1;
    min-width: 0;
    font: inherit;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
  }
  button {
    font: inherit;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-secondary {
    padding: 10px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .timer {
    width: 100%;
    margin-top: 8px;
    padding: 10px 0;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    background: var(--bg);
    color: var(--accent-dark);
    border: 1px solid var(--border);
  }
  .timer.running { background: var(--accent); border-color: var(--accent); color: #fff; }
  .timer:disabled { opacity: .4; }
  .tabs button.running::after {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    margin-left: 6px;
    border-radius: 50%;
    vertical-align: 1px;
    background: var(--accent);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  .sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .side { text-align: center; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .stepper button {
    width: 42px; height: 44px;
    flex: none;
    font-size: 22px;
    background: var(--bg);
    color: var(--accent-dark);
    border: 1px solid var(--border);
  }
  .stepper input {
    width: 48px;
    min-width: 0;
    font-family: inherit;
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    border: none;
    background: transparent;
    color: var(--text);
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .unit { font-size: 12px; color: var(--muted); }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
  .quick button {
    padding: 8px 0;
    font-size: 13px;
    background: var(--bg);
    color: var(--accent-dark);
    border: 1px solid var(--border);
  }
  .summary {
    margin: 16px 0;
    padding: 12px;
    border-radius: 10px;
    background: var(--bg);
    text-align: center;
  }
  .summary strong { font-size: 18px; }
  .summary .note { margin-top: 4px; font-size: 13px; color: var(--accent-dark); }
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:disabled { opacity: .5; }
  .btn-link { background: none; color: var(--muted); padding: 10px 0 0; width: 100%; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .day-head span { font-size: 13px; color: var(--muted); text-align: right; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  li:first-child { border-top: none; }
  li .info { flex: 1; cursor: pointer; }
  li .time { font-weight: 600; }
  li .detail { font-size: 13px; color: var(--muted); }
  li .del { background: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }
  li.editing { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  footer { text-align: center; padding-bottom: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Feed Log</h1>
    <button id="syncStatus" class="sync" type="button"></button>
  </header>

  <section class="card">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-mode="feed" id="feedTab">Feed</button>
      <button type="button" role="tab" data-mode="diaper">Diaper</button>
    </div>

    <div id="feedFields">
      <label class="field" for="feedStart">Start of feed</label>
      <div class="row">
        <input type="datetime-local" id="feedStart">
        <button class="btn-secondary" type="button" data-now="feedStart">Now</button>
      </div>
      <div class="sides">
        <div class="side">
          <label class="field" for="left">Left</label>
          <div class="stepper">
            <button type="button" data-target="left" data-step="-1" aria-label="Left minus one">−</button>
            <input type="number" id="left" inputmode="numeric" min="0" max="180" value="0">
            <button type="button" data-target="left" data-step="1" aria-label="Left plus one">+</button>
          </div>
          <div class="unit">min</div>
          <div class="quick">
            <button type="button" data-target="left" data-step="-30">−30</button>
            <button type="button" data-target="left" data-step="-15">−15</button>
            <button type="button" data-target="left" data-step="15">+15</button>
            <button type="button" data-target="left" data-step="30">+30</button>
          </div>
          <button type="button" class="timer" data-side="left"></button>
        </div>
        <div class="side">
          <label class="field" for="right">Right</label>
          <div class="stepper">
            <button type="button" data-target="right" data-step="-1" aria-label="Right minus one">−</button>
            <input type="number" id="right" inputmode="numeric" min="0" max="180" value="0">
            <button type="button" data-target="right" data-step="1" aria-label="Right plus one">+</button>
          </div>
          <div class="unit">min</div>
          <div class="quick">
            <button type="button" data-target="right" data-step="-30">−30</button>
            <button type="button" data-target="right" data-step="-15">−15</button>
            <button type="button" data-target="right" data-step="15">+15</button>
            <button type="button" data-target="right" data-step="30">+30</button>
          </div>
          <button type="button" class="timer" data-side="right"></button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
    </div>

    <div id="diaperFields" hidden>
      <label class="field" for="diaperTime">Time</label>
      <div class="row">
        <input type="datetime-local" id="diaperTime">
        <button class="btn-secondary" type="button" data-now="diaperTime">Now</button>
      </div>
      <div class="toggles">
        <button type="button" class="toggle" id="peeBtn" aria-pressed="false">Pee</button>
        <button type="button" class="toggle" id="poopBtn" aria-pressed="false">Poop</button>
      </div>
    </div>

    <button class="btn-primary" id="saveBtn" type="button">Save feed</button>
    <button class="btn-link" id="cancelBtn" type="button" hidden>Cancel edit</button>
  </section>

  <div id="history"></div>

  <footer>
    <button class="btn-secondary" id="exportBtn" type="button">Export CSV</button>
  </footer>
</main>

<dialog id="settings">
  <h2>Sync with Airtable</h2>
  <p class="hint">
    Both phones use the same base and token. The base needs a <b>Feeds</b> table
    (<b>Start</b>, <b>Left</b>, <b>Right</b>) and a <b>Diapers</b> table (<b>Time</b>, <b>Pee</b>, <b>Poop</b>).
  </p>
  <label class="field" for="baseInput">Airtable base (ID or any link to it)</label>
  <input type="text" id="baseInput" class="setting" placeholder="app…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label class="field" for="tokenInput">Personal access token (data.records:read + write)</label>
  <input type="password" id="tokenInput" class="setting" placeholder="pat…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="hint" id="settingsError" hidden></p>
  <div class="dialog-actions">
    <button class="btn-secondary" id="removeTokenBtn" type="button">Stop syncing</button>
    <button class="btn-secondary" id="closeSettingsBtn" type="button">Cancel</button>
    <button class="btn-primary" id="saveTokenBtn" type="button">Save</button>
  </div>
</dialog>

<script>
// Entries sync to Airtable, one table per entry type. localStorage is the
// offline cache: new entries get a "local-" id until Airtable assigns a "rec"
// id, edits to synced entries are flagged `pending`, and deletes wait in a
// queue until pushed.
const TYPES = {
  feed: {
    table: 'Feeds',
    fields: ['Start', 'Left', 'Right'],
    toFields: (e) => ({ Start: e.start, Left: e.left, Right: e.right }),
    fromFields: (f) => ({ start: f.Start, left: f.Left || 0, right: f.Right || 0 }),
  },
  diaper: {
    table: 'Diapers',
    fields: ['Time', 'Pee', 'Poop'],
    toFields: (e) => ({ Time: e.start, Pee: e.pee, Poop: e.poop }),
    fromFields: (f) => ({ start: f.Time, pee: !!f.Pee, poop: !!f.Poop }),
  },
};
const SYNC_DAYS = 30;
const POLL_MS = 30000;
const TIMER_MAX_MIN = 120;
const K = { entries: 'feeds.v1', deleted: 'feeds.deleted', token: 'airtable.token', base: 'airtable.base', draft: 'feeds.draft' };
const $ = (id) => document.getElementById(id);

// Entries saved before diapers existed have no type; deletes were bare ids.
let entries = loadJson(K.entries, []).map((e) => ({ type: 'feed', ...e }));
let deleted = loadJson(K.deleted, []).map((d) => (typeof d === 'string' ? { id: d, type: 'feed' } : d));
let token = localStorage.getItem(K.token) || '';
let base = localStorage.getItem(K.base) || '';
let mode = 'feed';
let editingId = null;
let editingType = null;
let sync_ = { running: false, again: false, state: 'idle', at: null };

function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch { return fallback; }
}

function persist() {
  localStorage.setItem(K.entries, JSON.stringify(entries));
  localStorage.setItem(K.deleted, JSON.stringify(deleted));
}

const isLocal = (e) => !e.id.startsWith('rec');
const unsyncedCount = () => entries.filter((e) => isLocal(e) || e.pending).length + deleted.length;
const sortEntries = () => entries.sort((a, b) => new Date(b.start) - new Date(a.start));
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// datetime-local needs "YYYY-MM-DDTHH:MM" in local time
function toLocalInput(date) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

function minutes(id) {
  const n = Math.round(Number($(id).value));
  return Number.isFinite(n) && n > 0 ? Math.min(n, 180) : 0;
}

const pressed = (id) => $(id).getAttribute('aria-pressed') === 'true';
const setPressed = (id, on) => $(id).setAttribute('aria-pressed', String(on));

function endOf(feed) {
  return new Date(new Date(feed.start).getTime() + (feed.left + feed.right) * 60000);
}

function diaperLabel(e) {
  if (e.pee && e.poop) return 'Pee & poop';
  return e.pee ? 'Pee' : 'Poop';
}

const fmtTime = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = (d) => {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
};

// ---------- Airtable ----------

async function api(type, path, { method = 'GET', body } = {}) {
  const res = await fetch(`https://api.airtable.com/v0/${base}/${TYPES[type].table}${path}`, {
    method,
    headers: { Authorization: `Bearer ${token}`, ...(body && { 'Content-Type': 'application/json' }) },
    body: body && JSON.stringify(body),
  });
  if (!res.ok) {
    const err = new Error(`Airtable ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

async function fetchRecent(type) {
  const { fields, fromFields } = TYPES[type];
  const timeField = fields[0];
  const params = new URLSearchParams({
    filterByFormula: `IS_AFTER({${timeField}}, DATEADD(NOW(), -${SYNC_DAYS}, 'days'))`,
    'sort[0][field]': timeField,
    'sort[0][direction]': 'desc',
    pageSize: '100',
  });
  fields.forEach((f) => params.append('fields[]', f));
  const out = [];
  let offset;
  do {
    if (offset) params.set('offset', offset);
    const page = await api(type, `?${params}`);
    for (const r of page.records) {
      if (!r.fields[timeField]) continue;
      out.push({ id: r.id, type, ...fromFields(r.fields) });
    }
    offset = page.offset;
  } while (offset);
  return out;
}

async function fetchAll() {
  const lists = await Promise.all(Object.keys(TYPES).map(fetchRecent));
  return lists.flat();
}

// A record-level 403/404/422 after the token has just been proven valid means
// the other phone already deleted that record.
const isGone = (err) => [403, 404, 422].includes(err.status);

async function pushChanges() {
  for (const d of [...deleted]) {
    try { await api(d.type, `/${d.id}`, { method: 'DELETE' }); }
    catch (err) { if (!isGone(err)) throw err; }
    deleted = deleted.filter((x) => x.id !== d.id);
    persist();
  }

  for (const e of entries.filter((x) => !isLocal(x) && x.pending)) {
    try {
      await api(e.type, `/${e.id}`, { method: 'PATCH', body: { fields: TYPES[e.type].toFields(e) } });
      e.pending = false; // no-op if the user replaced this object mid-request
    } catch (err) {
      if (!isGone(err)) throw err;
      entries = entries.filter((x) => x !== e);
    }
    persist();
  }

  for (const type of Object.keys(TYPES)) {
    const creates = entries.filter((e) => e.type === type && isLocal(e));
    for (let i = 0; i < creates.length; i += 10) {
      const batch = creates.slice(i, i + 10);
      const res = await api(type, '', {
        method: 'POST',
        body: { records: batch.map((e) => ({ fields: TYPES[type].toFields(e) })) },
      });
      batch.forEach((sent, j) => {
        const recId = res.records[j].id;
        const current = entries.find((x) => x.id === sent.id);
        if (!current) { deleted.push({ id: recId, type }); return; } // deleted while in flight
        current.pending = current !== sent; // edited while in flight: push again
        current.id = recId;
        if (editingId === sent.id) editingId = recId;
      });
      persist();
    }
  }
}

function mergeRemote(remote) {
  const gone = new Set(deleted.map((d) => d.id));
  const local = entries.filter((e) => isLocal(e) || e.pending);
  const localIds = new Set(local.map((e) => e.id));
  entries = [...remote.filter((r) => !gone.has(r.id) && !localIds.has(r.id)), ...local];
  sortEntries();
  persist();
}

async function sync() {
  if (!token || !base) return renderStatus();
  if (sync_.running) { sync_.again = true; return; }
  sync_.running = true;
  sync_.state = 'busy';
  renderStatus();
  try {
    let remote = await fetchAll(); // also proves the token and base work
    if (unsyncedCount() > 0) {
      await pushChanges();
      remote = await fetchAll();
    }
    mergeRemote(remote);
    sync_.state = 'ok';
    sync_.at = new Date();
  } catch (err) {
    sync_.state = [401, 403, 404].includes(err.status) ? 'auth' : 'offline';
  } finally {
    sync_.running = false;
    render();
    if (sync_.again) { sync_.again = false; sync(); }
  }
}

function renderStatus() {
  const el = $('syncStatus');
  const n = unsyncedCount();
  const unsynced = n ? ` · ${n} unsynced` : '';
  let text, state;
  if (!token || !base) { text = 'Set up sync'; state = 'error'; }
  else if (sync_.state === 'busy') { text = 'Syncing…'; state = 'busy'; }
  else if (sync_.state === 'auth') { text = 'Check sync settings'; state = 'error'; }
  else if (sync_.state === 'offline') { text = `Offline${unsynced}`; state = 'error'; }
  else if (sync_.state === 'ok') { text = `Synced ${fmtTime(sync_.at)}${unsynced}`; state = 'ok'; }
  else { text = `Not synced${unsynced}`; state = 'busy'; }
  el.textContent = text;
  el.dataset.state = state;
}

// ---------- Form ----------
// While a side timer is in use the feed form is a draft that is persisted,
// so it survives the phone locking or the app being closed mid-feed.

let timer = null; // { side: 'left' | 'right', since: epoch ms }
let draftActive = false;
let startTouched = false;

let timerNote = '';

// Elapsed time on the running timer, capped at TIMER_MAX_MIN.
const runningMs = () => (timer ? Math.min(Date.now() - timer.since, TIMER_MAX_MIN * 60000) : 0);
// Nearest minute, except a run under one minute still counts as 1.
const runningMinutes = () => (timer ? Math.max(1, Math.round(runningMs() / 60000)) : 0);
const fmtElapsed = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
const editingCurrent = () => !!editingId && editingType === mode;

function saveDraft() {
  if (!draftActive) return localStorage.removeItem(K.draft);
  localStorage.setItem(K.draft, JSON.stringify({
    start: $('feedStart').value, left: minutes('left'), right: minutes('right'), timer,
  }));
}

function restoreDraft() {
  const d = loadJson(K.draft, null);
  if (!d) return false;
  $('feedStart').value = d.start;
  $('left').value = d.left;
  $('right').value = d.right;
  timer = d.timer;
  draftActive = true;
  startTouched = true;
  return true;
}

// Stops a timer that has hit the cap, including one left running while the
// app was closed.
function enforceTimerLimit() {
  if (!timer || Date.now() - timer.since < TIMER_MAX_MIN * 60000) return;
  const side = timer.side;
  stopTimer();
  timerNote = `${side === 'left' ? 'Left' : 'Right'} timer stopped automatically at ${TIMER_MAX_MIN} min`;
  updateForm();
}

function stopTimer() {
  if (!timer) return;
  const side = timer.side;
  $(side).value = Math.min(180, minutes(side) + runningMinutes());
  timer = null;
  saveDraft();
  updateForm();
}

function toggleTimer(side) {
  const wasRunning = timer?.side;
  stopTimer();
  if (wasRunning === side) return;
  if (!draftActive && !startTouched && minutes('left') + minutes('right') === 0) {
    $('feedStart').value = toLocalInput(new Date());
  }
  timer = { side, since: Date.now() };
  timerNote = '';
  draftActive = true;
  saveDraft();
  updateForm();
}

function renderTimers() {
  document.querySelectorAll('.timer').forEach((btn) => {
    const running = timer?.side === btn.dataset.side;
    btn.classList.toggle('running', running);
    btn.textContent = running ? `■ ${fmtElapsed(runningMs())}` : '▶ Start timer';
    btn.disabled = editingType === 'feed';
  });
  $('feedTab').classList.toggle('running', !!timer);
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  $('feedFields').hidden = m !== 'feed';
  $('diaperFields').hidden = m !== 'diaper';
  updateForm();
}

function updateForm() {
  $('saveBtn').textContent = `${editingCurrent() ? 'Update' : 'Save'} ${mode}`;
  $('cancelBtn').textContent = editingCurrent() ? 'Cancel edit' : 'Discard';
  $('cancelBtn').hidden = !(editingCurrent() || (mode === 'feed' && draftActive));
  renderTimers();
  if (mode === 'diaper') {
    $('saveBtn').disabled = !$('diaperTime').value || !(pressed('peeBtn') || pressed('poopBtn'));
    return;
  }
  const startVal = $('feedStart').value;
  const total = minutes('left') + minutes('right') + runningMinutes();
  if (!startVal) {
    $('summary').innerHTML = 'Pick a start time';
    $('saveBtn').disabled = true;
    return;
  }
  const end = new Date(new Date(startVal).getTime() + total * 60000);
  $('summary').innerHTML = `Total <strong>${total} min</strong> &middot; Ends <strong>${fmtTime(end)}</strong>`
    + (timerNote ? `<div class="note">${timerNote}</div>` : '');
  $('saveBtn').disabled = total === 0;
}

function resetFeed() {
  if (editingType === 'feed') { editingId = null; editingType = null; }
  timer = null;
  timerNote = '';
  draftActive = false;
  startTouched = false;
  $('feedStart').value = toLocalInput(new Date());
  $('left').value = 0;
  $('right').value = 0;
  saveDraft();
}

function resetDiaper() {
  if (editingType === 'diaper') { editingId = null; editingType = null; }
  $('diaperTime').value = toLocalInput(new Date());
  setPressed('peeBtn', false);
  setPressed('poopBtn', false);
}

function resetForm(type) {
  if (type === 'feed') resetFeed(); else resetDiaper();
  updateForm();
  render();
}

function save() {
  if (mode === 'feed') stopTimer();
  const startVal = $(mode === 'feed' ? 'feedStart' : 'diaperTime').value;
  if (!startVal) return;
  const editing = editingCurrent();
  const common = {
    id: editing ? editingId : `local-${crypto.randomUUID?.() || Date.now()}`,
    type: mode,
    start: new Date(startVal).toISOString(),
  };
  const entry = mode === 'feed'
    ? { ...common, left: minutes('left'), right: minutes('right') }
    : { ...common, pee: pressed('peeBtn'), poop: pressed('poopBtn') };
  if (mode === 'feed' ? entry.left + entry.right === 0 : !(entry.pee || entry.poop)) return;
  if (editing) {
    entry.pending = !isLocal(entry);
    entries = entries.map((e) => (e.id === editingId ? entry : e));
  } else {
    entries.push(entry);
  }
  sortEntries();
  persist();
  resetForm(mode);
  sync();
}

function edit(id) {
  const e = entries.find((x) => x.id === id);
  if (!e) return;
  if (e.type === 'feed' && draftActive && !confirm('Discard the feed in progress?')) return;
  if (editingType) resetForm(editingType);
  if (e.type === 'feed') {
    resetFeed();
    $('feedStart').value = toLocalInput(new Date(e.start));
    $('left').value = e.left;
    $('right').value = e.right;
  } else {
    resetDiaper();
    $('diaperTime').value = toLocalInput(new Date(e.start));
    setPressed('peeBtn', e.pee);
    setPressed('poopBtn', e.poop);
  }
  editingId = id;
  editingType = e.type;
  setMode(e.type);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function remove(id) {
  const e = entries.find((x) => x.id === id);
  if (!e) return;
  if (!confirm(`Delete ${e.type} at ${fmtTime(new Date(e.start))}?`)) return;
  entries = entries.filter((x) => x.id !== id);
  if (!isLocal(e)) deleted.push({ id, type: e.type });
  persist();
  if (editingId === id) resetForm(e.type); else render();
  sync();
}

function daySummary(list) {
  const feeds = list.filter((e) => e.type === 'feed');
  const diapers = list.filter((e) => e.type === 'diaper');
  const parts = [];
  if (feeds.length) {
    const totalMin = feeds.reduce((s, f) => s + f.left + f.right, 0);
    parts.push(`${plural(feeds.length, 'feed')} &middot; ${totalMin} min`);
  }
  if (diapers.length) {
    const pee = diapers.filter((d) => d.pee).length;
    const poop = diapers.filter((d) => d.poop).length;
    parts.push(`${plural(diapers.length, 'diaper')} &middot; ${pee} pee &middot; ${poop} poop`);
  }
  return parts.join('<br>');
}

function entryHtml(e) {
  const pending = isLocal(e) || e.pending ? ' <span class="pending" title="Not synced yet">•</span>' : '';
  const [time, detail] = e.type === 'feed'
    ? [`${fmtTime(new Date(e.start))} – ${fmtTime(endOf(e))}`,
       `L ${e.left} min &middot; R ${e.right} min &middot; ${e.left + e.right} min total`]
    : [`${fmtTime(new Date(e.start))} <span class="tag">Diaper</span>`, diaperLabel(e)];
  return `
    <li data-id="${e.id}" class="${e.id === editingId ? 'editing' : ''}">
      <div class="info">
        <div class="time">${time}${pending}</div>
        <div class="detail">${detail}</div>
      </div>
      <button class="del" aria-label="Delete">&times;</button>
    </li>`;
}

function render() {
  renderStatus();
  const container = $('history');
  if (entries.length === 0) {
    container.innerHTML = '<div class="card empty">Nothing logged yet</div>';
    return;
  }
  const groups = new Map();
  for (const e of entries) {
    const key = new Date(e.start).toDateString();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  container.innerHTML = '';
  for (const [key, list] of groups) {
    const card = document.createElement('section');
    card.className = 'card';
    card.innerHTML = `
      <div class="day-head">
        <h2>${fmtDay(new Date(key))}</h2>
        <span>${daySummary(list)}</span>
      </div>
      <ul>${list.map(entryHtml).join('')}</ul>`;
    container.appendChild(card);
  }
}

function exportCsv() {
  const fmt = (d) => toLocalInput(d).replace('T', ' ');
  const rows = [['type', 'start', 'end', 'left_min', 'right_min', 'total_min', 'pee', 'poop']];
  for (const e of [...entries].reverse()) {
    rows.push(e.type === 'feed'
      ? ['feed', fmt(new Date(e.start)), fmt(endOf(e)), e.left, e.right, e.left + e.right, '', '']
      : ['diaper', fmt(new Date(e.start)), '', '', '', '', e.pee ? 1 : 0, e.poop ? 1 : 0]);
  }
  const blob = new Blob([rows.map((r) => r.join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `feed-log-${toLocalInput(new Date()).slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Settings ----------

function openSettings() {
  $('baseInput').value = base;
  $('tokenInput').value = token;
  $('settingsError').hidden = sync_.state !== 'auth';
  $('settingsError').textContent = 'Airtable rejected these settings. Check the base ID and the token\'s scopes and base access.';
  $('removeTokenBtn').hidden = !token && !base;
  $('settings').showModal();
}

function saveSetting(key, value) {
  if (value) localStorage.setItem(key, value);
  else localStorage.removeItem(key);
}

function setSyncSettings(baseValue, tokenValue) {
  base = baseValue.match(/app[A-Za-z0-9]{14}/)?.[0] || '';
  token = tokenValue.trim();
  saveSetting(K.base, base);
  saveSetting(K.token, token);
  sync_.state = 'idle';
  $('settings').close();
  render();
  sync();
}

// ---------- Wiring ----------

document.querySelectorAll('button[data-step]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.target;
    $(id).value = Math.max(0, Math.min(180, minutes(id) + Number(btn.dataset.step)));
    saveDraft();
    updateForm();
  });
});
document.querySelectorAll('button[data-now]').forEach((btn) => {
  btn.addEventListener('click', () => {
    $(btn.dataset.now).value = toLocalInput(new Date());
    if (btn.dataset.now === 'feedStart') startTouched = true;
    saveDraft();
    updateForm();
  });
});
document.querySelectorAll('.timer').forEach((btn) => btn.addEventListener('click', () => toggleTimer(btn.dataset.side)));
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === mode) return;
    if (editingType) resetForm(editingType);
    setMode(btn.dataset.mode);
  });
});
['peeBtn', 'poopBtn'].forEach((id) => $(id).addEventListener('click', () => { setPressed(id, !pressed(id)); updateForm(); }));
$('feedStart').addEventListener('input', () => { startTouched = true; saveDraft(); updateForm(); });
['diaperTime', 'left', 'right'].forEach((id) => $(id).addEventListener('input', () => { saveDraft(); updateForm(); }));
['left', 'right'].forEach((id) => $(id).addEventListener('focus', (e) => e.target.select()));
$('saveBtn').addEventListener('click', save);
$('cancelBtn').addEventListener('click', () => {
  if (!editingCurrent() && !confirm('Discard this feed?')) return;
  resetForm(mode);
});
$('exportBtn').addEventListener('click', exportCsv);
$('history').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  if (e.target.closest('.del')) remove(li.dataset.id);
  else if (e.target.closest('.info')) edit(li.dataset.id);
});
$('syncStatus').addEventListener('click', openSettings);
$('saveTokenBtn').addEventListener('click', () => setSyncSettings($('baseInput').value, $('tokenInput').value));
$('removeTokenBtn').addEventListener('click', () => setSyncSettings('', ''));
$('closeSettingsBtn').addEventListener('click', () => $('settings').close());

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
window.addEventListener('online', sync);
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, POLL_MS);
setInterval(() => { if (timer) { enforceTimerLimit(); updateForm(); } }, 1000);

if (!restoreDraft()) resetFeed();
resetDiaper();
enforceTimerLimit();
setMode('feed');
render();
sync();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
